# VPS: Traefik (external) → Next.js. docker-compose 1.27 on server (omsk-bike).
version: "3.7"

services:
  oval:
    image: ${OVAL_IMAGE}
    restart: unless-stopped
    env_file:
      - config.env
      - secrets.env
    # Docker 20.10 + default seccomp: Node cannot create worker threads (uv_thread_create).
    security_opt:
      - seccomp=unconfined
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oval.rule=Host(`${OVAL_DOMAIN}`)"
      - "traefik.http.routers.oval.entrypoints=websecure"
      - "traefik.http.routers.oval.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-myresolver}"
      - "traefik.http.routers.oval.tls.domains[0].main=${OVAL_DOMAIN}"
      - "traefik.http.routers.oval.middlewares=oval-compress"
      - "traefik.http.middlewares.oval-compress.compress=true"
      - "traefik.http.services.oval.loadbalancer.server.port=3000"
    volumes:
      - ./data/uploads:/app/data/uploads
    logging:
      driver: json-file
      options:
        max-size: "50m"
    networks:
      traefik:
        aliases:
          - oval

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-theta-brige}
