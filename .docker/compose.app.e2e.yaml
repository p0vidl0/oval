# Next.js production server for Playwright (oval-e2e).
services:
  app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.e2e
      args:
        DATABASE_URL: postgresql://oval:${OVAL_DB_PASSWORD}@127.0.0.1:5432/oval
    restart: unless-stopped
    ports:
      - "${NEXT_DEV_HOST_PORT}:3000"
    env_file:
      - path: env/oval-e2e.env
        required: true
    environment:
      DATABASE_URL: postgresql://oval:${OVAL_DB_PASSWORD}@postgres:5432/oval
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/feed').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 40s
