# https://lefthook.dev/configuration/lefthook/
# lefthook: — как вызывать бинарник из git-хуков (GUI git не видит pnpm/node).
# rc: — PATH/nvm до команд (см. hook.tmpl).
# Skip: LEFTHOOK=0 git commit …

min_version: 1.11.14
lefthook: bash scripts/lefthook-bin.sh
rc: scripts/git-hook-env.sh

pre-commit:
  parallel: false
  skip_output:
    - execution_out
  jobs:
    - name: precommit
      run: pnpm run precommit
